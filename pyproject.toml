[project]
name = "ocx-mcp"
version = "0.1.0"
description = "MCP server exposing OCX .3docx ship models to LLM clients"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0,<2",
    "loguru>=0.7",
    "ocx-model-core>=0.6,<0.7",
    "ocx-model-validator>=0.7,<0.8",
]

[project.scripts]
ocx-mcp = "ocx_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocx_mcp"]

# ocx-platform packages, pinned to one commit. To upgrade, change both rev
# values and run `uv lock`.
[tool.uv.sources]
ocx-model-core = { git = "https://github.com/OCXStandard/ocx-platform", subdirectory = "packages/ocx-model-core", rev = "f8fd680069099247a6a31640edef86d3683b381b" }
ocx-model-validator = { git = "https://github.com/OCXStandard/ocx-platform", subdirectory = "packages/ocx-model-validator", rev = "f8fd680069099247a6a31640edef86d3683b381b" }

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "pre-commit>=4.0",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100
# ocx_mcp (src/) and tests (.) are first-party for import sorting
src = ["src", "."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["."]
